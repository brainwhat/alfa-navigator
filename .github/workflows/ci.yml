name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 62.0.0
  UV_VERSION: 0.10.2

jobs:
  test:
    name: Tests + smoke on runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Start app on runner
        env:
          DB_PATH: ${{ runner.temp }}/loans.db
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
      - name: Smoke test (full e2e)
        run: python scripts/smoke.py http://127.0.0.1:8000 --full
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/uvicorn.log"

  deploy:
    name: Deploy to Vercel
    needs: test
    # Fork PRs get no secrets, so they are only tested.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Vercel secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задан (Settings → Secrets and variables → Actions). См. README, раздел «Деплой на Vercel»."
              exit 1
            fi
          done

      # vercel build installs the Python function's dependencies with uv
      - run: python -m pip install uv==${UV_VERSION}
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          deploy_url=$(vercel deploy --prebuilt $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN")
          url=$deploy_url
          # The unique deployment URL sits behind Vercel Authentication; production also gets a public alias.
          if [ "$TARGET" = production ]; then
            for attempt in 1 2 3 4 5 6; do
              alias=$(vercel inspect "$url" --format=json --token="$VERCEL_TOKEN" 2>/dev/null \
                | python -c "import json,sys; a=json.load(sys.stdin).get('aliases') or ['']; print(a[0])" || true)
              [ -n "$alias" ] && break
              sleep 5
            done
            url=${alias:+https://$alias}
            url=${url:-$deploy_url}
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployment
        run: python scripts/smoke.py "${{ steps.deploy.outputs.url }}" $([ "$TARGET" = production ] && echo --strict)
