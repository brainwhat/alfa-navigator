name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 62.0.0
  UV_VERSION: 0.10.2

jobs:
  test:
    name: Tests + smoke on runner (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: navigator
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Empty for the sqlite run, so the app falls back to SQLite.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/navigator' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: OpenAPI snapshot is current
        run: python scripts/export_openapi.py --check

      - name: Start app on runner
        env:
          DB_PATH: ${{ runner.temp }}/loans.db
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
      - name: Smoke test (full e2e)
        run: python scripts/smoke.py http://127.0.0.1:8000 --full
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/uvicorn.log"

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest e2e -q --screenshot only-on-failure --tracing retain-on-failure --output e2e-results
      - name: Screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      # requirements.txt pins every transitive package, so the audit checks exactly what gets deployed
      - run: pip-audit --strict --no-deps -r requirements.txt

  deploy:
    name: Deploy to Vercel
    needs: [test, e2e, audit]
    # Fork PRs get no secrets, so they are only tested.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DEMO_CLIENT_PASSWORD: ${{ secrets.DEMO_CLIENT_PASSWORD }}
      DEMO_BANK_PASSWORD: ${{ secrets.DEMO_BANK_PASSWORD }}
      TARGET: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Vercel secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задан (Settings → Secrets and variables → Actions). См. README, раздел «Деплой на Vercel»."
              exit 1
            fi
          done

      # vercel build installs the Python function's dependencies with uv
      - run: python -m pip install uv==${UV_VERSION}
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          deploy_url=$(vercel deploy --prebuilt $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN")
          url=$deploy_url
          # The unique deployment URL sits behind Vercel Authentication; production also gets a public alias.
          if [ "$TARGET" = production ]; then
            for attempt in 1 2 3 4 5 6; do
              curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/${deploy_url#https://}?teamId=$VERCEL_ORG_ID" > "$RUNNER_TEMP/deployment.json"
              alias=$(python -c "import json,sys; a=json.load(open(sys.argv[1])).get('alias') or ['']; print(a[0])" "$RUNNER_TEMP/deployment.json" || true)
              [ -n "$alias" ] && break
              sleep 5
            done
            [ -n "$alias" ] || { echo "::warning::Не удалось получить алиас production"; head -c 500 "$RUNNER_TEMP/deployment.json"; }
            url=${alias:+https://$alias}
            url=${url:-$deploy_url}
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      # Production gets a read-only check: readiness, logins and a database read.
      # The full write scenario runs on preview only once preview has its own database (README, «База данных»).
      - name: Smoke test deployment
        env:
          PREVIEW_DATABASE_ISOLATED: ${{ vars.PREVIEW_DATABASE_ISOLATED }}
        run: |
          flags=""
          [ "$TARGET" = production ] && flags="--strict"
          [ "$TARGET" = preview ] && [ "$PREVIEW_DATABASE_ISOLATED" = true ] && flags="--full"
          python scripts/smoke.py "${{ steps.deploy.outputs.url }}" $flags
